# ~/.tmux.conf — modernised for tmux 3.x (Jun 2026)
# Your original bindings + layout preserved; only options tmux removed/renamed
# were rewritten (mouse, utf8, -fg/-bg/-attr -> -style, force-width, clipboard).

# --- Prefix (screen-friendly) ---
set-option -g prefix C-z
unbind-key C-b
bind-key z send-prefix

# toggle last window / step through panes
bind-key C-x last-window
bind-key C-z select-pane -t :.+

# split with 25% at the bottom  (-p 25 is deprecated; -l 25% is the modern form)
bind-key C-t split-window -l 25%

# clipboard: OSC52 — works over SSH and across Linux + macOS, replaces the
# old `xclip` binding (which was Linux-only).
set-option -g set-clipboard on

# --- Global options ---
set-option -g bell-action none
set-option -g default-terminal "tmux-256color"
set-option -g mouse on                 # replaces mode-mouse + mouse-select-pane
set-option -g status-keys vi
set-option -g status-right-length 60
set-option -g history-limit 15000
# (utf8 on removed — modern tmux auto-detects UTF-8)

# --- Window options ---
set-window-option -g mode-keys vi
set-window-option -g automatic-rename off

# --- Other key bindings ---
bind-key i choose-window
# toggle activity monitoring (proper toggle; old `setw monitor-activity` no longer valid bare)
bind-key m if -F '#{monitor-activity}' 'setw monitor-activity off' 'setw monitor-activity on'
bind-key D detach \; lock
bind-key N neww \; splitw -d
# (force-width on y/u dropped — tmux removed force-width/-height in 2.9)

# --- Statusbar ---
set-option -g display-time 2
set-option -g status-interval 10
set-option -g status-left-length 35
set-option -g status-left '#[fg=green](#S) #(whoami)@#H#[default]'
# load average — sed handles both Linux ("load average:") and macOS ("load averages:")
set-option -g status-right '#[fg=yellow]#(uptime | sed -E "s/.*load average[s]?: //")#[default] #[fg=blue]%H:%M#[default]'

# statusbar styles (replace the removed -fg/-bg/-attr options)
set-option -g status-style 'fg=white,bg=default'
set-window-option -g window-status-style 'fg=cyan,bg=default,dim'
set-window-option -g window-status-current-style 'fg=white,bg=default,bright'
set-option -g message-style 'fg=magenta,bg=black,bright'

# reload
bind-key r source-file ~/.tmux.conf \; display "reloaded ~/.tmux.conf"

# --- No-prefix window/pane navigation ---
bind-key -n "C-Left"  select-window -t :-
bind-key -n "C-Right" select-window -t :+
bind-key -n "C-Up"    select-pane -t :.-
bind-key -n "C-Down"  select-pane -t :.+
bind-key -r Tab select-pane -t :.+

# --- vi copy-mode (you're on mode-keys vi) ---
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
